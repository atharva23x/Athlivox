services:
  - type: web
    name: athlivox
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ATHLIVOX_DATA_DIR
        value: /var/data
    disk:
      name: athlivox-data
      mountPath: /var/data
      sizeGB: 1
